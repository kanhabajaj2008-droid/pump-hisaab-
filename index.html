<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><link rel="manifest" href="manifest.json"><title>Pump Hisaab V2</title><style>
:root{--bg:#f4f7fb;--card:#fff;--text:#101828;--muted:#667085;--line:#e4e7ec;--brand:#1769ff;--brand2:#0f4dcc;--ok:#067647;--danger:#b42318;--dark:#0b1220;--shadow:0 10px 30px rgba(16,24,40,.08)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{min-height:100vh}.top{height:68px;background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:20}.brand{font-weight:800;font-size:20px}.brand small{display:block;font-size:11px;color:#98a2b3;font-weight:500}.top-right{display:flex;align-items:center;gap:10px}.pill{padding:8px 12px;border:1px solid #344054;border-radius:999px;font-size:12px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700}.btn.primary{background:var(--brand);color:#fff}.btn.secondary{background:#eef4ff;color:#175cd3}.btn.ghost{background:transparent;color:#fff;border:1px solid #344054}.btn.danger{background:#fee4e2;color:#b42318}.btn:disabled{opacity:.5;cursor:not-allowed}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 68px)}.side{background:#fff;border-right:1px solid var(--line);padding:16px;position:sticky;top:68px;height:calc(100vh - 68px)}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;text-align:left;padding:12px;border-radius:10px;color:#475467;font-weight:650}.nav button.active,.nav button:hover{background:#eef4ff;color:#175cd3}.main{padding:22px;max-width:1400px;width:100%;margin:auto}.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.hero{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}.hero h1{margin:0 0 5px;font-size:27px}.muted{color:var(--muted)}.stat .label{font-size:12px;color:var(--muted)}.stat .value{font-size:25px;font-weight:800;margin-top:5px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px}.section-title h2,.section-title h3{margin:0}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:12px;font-weight:700;color:#475467}.field input,.field select{width:100%;border:1px solid #d0d5dd;border-radius:10px;padding:11px 12px;background:#fff;outline:none}.field input:focus,.field select:focus{border-color:var(--brand);box-shadow:0 0 0 3px #dbe8ff}.actions{display:flex;gap:8px;flex-wrap:wrap}.machine{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}.machine-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.machine h3{margin:0}.nozzle{border:1px solid #edf0f4;border-radius:12px;padding:12px;margin-top:10px}.nozzle-head{display:flex;justify-content:space-between;align-items:center}.nozzle-title{font-weight:800}.badge{font-size:11px;border-radius:999px;padding:5px 8px;background:#f2f4f7;color:#475467}.badge.ok{background:#ecfdf3;color:#067647}.badge.lock{background:#f2f4f7;color:#344054}.reading-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}.reading-result{background:#f8fafc;border-radius:10px;padding:10px}.reading-result b{display:block;font-size:15px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;white-space:nowrap}.empty{text-align:center;padding:28px;color:var(--muted)}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#08111f,#123b7a)}.login-card{background:#fff;border-radius:20px;padding:28px;width:min(430px,100%);box-shadow:0 25px 70px rgba(0,0,0,.25)}.login-card h1{margin:0 0 5px}.error{color:var(--danger);background:#fff1f0;border:1px solid #fecdca;padding:10px;border-radius:10px;font-size:13px;margin:10px 0}.success{color:var(--ok);background:#ecfdf3;border:1px solid #abefc6;padding:10px;border-radius:10px;font-size:13px;margin:10px 0}.price-card{display:flex;justify-content:space-between;align-items:center;gap:15px}.price{font-size:30px;font-weight:900}.locked{font-size:12px;color:#667085}.mobile-nav{display:none}.toast{position:fixed;right:18px;bottom:18px;background:#101828;color:#fff;padding:12px 16px;border-radius:10px;z-index:99;box-shadow:var(--shadow)}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{display:none}.main{padding:14px 12px 88px}.g2,.g3{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}.top{padding:0 12px}.top-right .pill{display:none}.mobile-nav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:30}.mobile-nav button{border:0;background:#fff;padding:10px 4px;font-size:11px;color:#475467}.mobile-nav button.active{color:#175cd3;font-weight:800}.reading-grid{grid-template-columns:1fr}.price-card{align-items:flex-start;flex-direction:column}}
</style></head><body><div id="loginView" class="login"><div class="login-card"><div class="brand" style="color:#101828;font-size:24px">⛽ Pump Hisaab <small style="color:#667085">V2 • Petrol Pump Management</small></div><p class="muted">Sign in with your Firebase account.</p><div id="loginError" class="error hidden"></div><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" class="btn primary" style="width:100%">Login</button></div></div>
<div id="app" class="app hidden"><header class="top"><div><div class="brand">⛽ Pump Hisaab</div><div id="pumpLabel" style="font-size:11px;color:#98a2b3"></div></div><div class="top-right"><select id="pumpSelect" class="pill" style="background:#111b2e;color:#fff"></select><span id="userPill" class="pill"></span><button id="logoutBtn" class="btn ghost">Logout</button></div></header><div class="layout"><aside class="side"><div class="nav"><button data-page="dashboard" class="active">🏠 Dashboard</button><button data-page="daily">⛽ Daily Hisaab</button><button data-page="sales">📊 Sales</button><button data-page="prices">💰 Fuel Prices</button><button data-page="expenses">💸 Expenses</button><button data-page="reports">📈 Reports</button><button data-page="staff" id="staffNav">👥 Staff</button></div></aside><main class="main"><div id="page"></div></main></div><nav class="mobile-nav"><button data-page="dashboard" class="active">🏠<br>Home</button><button data-page="daily">⛽<br>Hisaab</button><button data-page="prices">💰<br>Prices</button><button data-page="sales">📊<br>Sales</button></nav></div><div id="toast" class="toast hidden"></div>
<script src="js/config.js"></script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js';
import {getFirestore,doc,getDoc,getDocs,collection,query,where,addDoc,setDoc,orderBy,limit,serverTimestamp} from 'https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js';
const $=id=>document.getElementById(id); const cfg=window.FIREBASE_CONFIG;
if(!cfg) throw new Error('Firebase config missing'); const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
let profile=null,pumps=[],currentPump=null,currentPage='dashboard',prices={petrol:null,diesel:null};
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const num=v=>v===''||v==null?null:Number(v); const toast=m=>{ $('toast').textContent=m;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2500)};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadProfile(){const me=auth.currentUser;if(!me) return;const us=await getDoc(doc(db,'users',me.uid));if(!us.exists())throw Error('Your Firebase user profile was not found in Firestore.');profile={id:us.id,...us.data()};const ps=await getDocs(collection(db,'pumps'));pumps=ps.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.active!==false);if(profile.role!=='owner')pumps=pumps.filter(p=>(profile.pumpAccess||[]).includes(p.id)|| (profile.pumpAccess||[]).includes(p.code));if(!pumps.length)throw Error('No pump has been assigned to this account.');currentPump=pumps[0];$('userPill').textContent=`${profile.name||'User'} • ${profile.role}`;$('staffNav').classList.toggle('hidden',profile.role!=='owner');renderPumpSelect();await loadPrices();render();}
function renderPumpSelect(){$('pumpSelect').innerHTML=pumps.map(p=>`<option value="${esc(p.id)}">${esc(p.company||'')} • ${esc(p.name||p.code||p.id)}</option>`).join('');$('pumpSelect').value=currentPump.id;$('pumpLabel').textContent=`${currentPump.company||''} • ${currentPump.name||currentPump.code||currentPump.id}`}
async function loadPrices(){const s=await getDoc(doc(db,'fuelPrices',currentPump.id));prices=s.exists()?{petrol:s.data().petrol??null,diesel:s.data().diesel??null}: {petrol:null,diesel:null};}
$('loginBtn').onclick=async()=>{ $('loginError').classList.add('hidden');try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(e){$('loginError').textContent=e.message;$('loginError').classList.remove('hidden')}};
$('logoutBtn').onclick=()=>signOut(auth);$('pumpSelect').onchange=async()=>{currentPump=pumps.find(p=>p.id===$('pumpSelect').value);await loadPrices();render()};
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{currentPage=b.dataset.page;document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===currentPage));render()});
function dashboard(){return `<div class="hero"><div><h1>${esc(currentPump.name)}</h1><div class="muted">${esc(currentPump.company)} • Today’s overview</div></div><button class="btn primary" onclick="window.goDaily()">+ New Full Day Shift</button></div><div class="grid g3"><div class="card stat"><div class="label">Petrol Price</div><div class="value">${prices.petrol!=null?money(prices.petrol):'Not set'}</div><div class="muted">per litre</div></div><div class="card stat"><div class="label">Diesel Price</div><div class="value">${prices.diesel!=null?money(prices.diesel):'Not set'}</div><div class="muted">per litre</div></div><div class="card stat"><div class="label">Access</div><div class="value" style="text-transform:capitalize">${esc(profile.role)}</div><div class="muted">${profile.role==='owner'?'Full control':'Entry & view access'}</div></div></div><div class="grid g2" style="margin-top:16px"><div class="card"><div class="section-title"><h3>How Daily Hisaab works</h3></div><p class="muted">Choose Full Day Shift, enter readings for each machine, and leave unused machines or nozzles blank. The app calculates litres and amounts automatically.</p></div><div class="card"><div class="section-title"><h3>Fuel prices</h3></div><p class="muted">${profile.role==='owner'?'You can change prices. Staff accounts can only view them.':'Prices are locked by the Owner.'}</p></div></div>`}
function nozzle(type,i){const id=`${type}${i}`;return `<div class="nozzle"><div class="nozzle-head"><div class="nozzle-title">${type==='petrol'?'⛽ Petrol':'🛢️ Diesel'} ${i}</div><span id="badge-${id}" class="badge">Not used</span></div><div class="reading-grid"><div class="field"><label>Opening Reading</label><input type="number" step="0.01" id="${id}-open" oninput="window.calcNozzle('${type}',${i})"></div><div class="field"><label>Closing Reading</label><input type="number" step="0.01" id="${id}-close" oninput="window.calcNozzle('${type}',${i})"></div><div class="reading-result"><span class="muted">Litres sold</span><b id="${id}-litres">—</b><span class="muted">Amount</span><b id="${id}-amount">—</b></div></div></div>`}
function machine(i){return `<div class="machine"><div class="machine-head"><h3>Machine ${i}</h3><span class="badge">2 Petrol • 2 Diesel</span></div>${nozzle('petrol',1)}${nozzle('petrol',2)}${nozzle('diesel',1)}${nozzle('diesel',2)}</div>`}
function daily(){return `<div class="hero"><div><h1>Full Day Shift</h1><div class="muted">Enter readings machine-by-machine. Unused nozzles can stay blank.</div></div></div><div class="card"><div class="grid g3"><div class="field"><label>Date</label><input id="shiftDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Shift</label><select id="shiftType"><option>Full Day Shift</option></select></div><div class="field"><label>Number of Machines</label><select id="machineCount"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select></div></div><div id="machines"></div><div class="actions" style="margin-top:16px"><button class="btn primary" id="saveShift">Save Full Day Hisaab</button><button class="btn secondary" onclick="window.clearDaily()">Clear</button></div><div id="dailyMsg"></div></div>`}
function bindDaily(){const c=$('machineCount');const draw=()=>{$('machines').innerHTML=Array.from({length:Number(c.value)},(_,i)=>machine(i+1)).join('')};c.onchange=draw;draw();$('saveShift').onclick=saveShift;}
window.calcNozzle=(type,i)=>{const id=`${type}${i}`,o=num($(`${id}-open`).value),cl=num($(`${id}-close`).value),rate=prices[type];const b=$(`badge-${id}`),lit=$(`${id}-litres`),amt=$(`${id}-amount`);if(o==null&&cl==null){b.textContent='Not used';b.className='badge';lit.textContent='—';amt.textContent='—';return}if(o==null||cl==null){b.textContent='Incomplete';b.className='badge';lit.textContent='—';amt.textContent='—';return}const l=cl-o;b.textContent=l>=0?'Used':'Check reading';b.className='badge '+(l>=0?'ok':'');lit.textContent=l.toFixed(2)+' L';amt.textContent=rate!=null?money(l*rate):'Rate not set'};
window.clearDaily=()=>{document.querySelectorAll('#machines input').forEach(x=>x.value='');document.querySelectorAll('[id^="badge-"]').forEach(x=>{x.textContent='Not used';x.className='badge'});document.querySelectorAll('[id$="-litres"]').forEach(x=>x.textContent='—');document.querySelectorAll('[id$="-amount"]').forEach(x=>x.textContent='—')};
async function saveShift(){const date=$('shiftDate').value,mcount=Number($('machineCount').value);if(!date)return;const machines=[];let totalLitres={petrol:0,diesel:0},totalAmount={petrol:0,diesel:0};for(let m=1;m<=mcount;m++){const nozzles=[];for(const type of ['petrol','diesel'])for(let i=1;i<=2;i++){const id=`${type}${i}`,o=num($(`${id}-open`).value),cl=num($(`${id}-close`).value);if(o==null&&cl==null)continue;if(o==null||cl==null){$('dailyMsg').innerHTML='<div class="error">Each used nozzle must have both opening and closing readings, or leave both blank.</div>';return}const litres=cl-o;if(litres<0){$('dailyMsg').innerHTML='<div class="error">Closing reading cannot be lower than opening reading.</div>';return}const rate=prices[type];if(rate==null){$('dailyMsg').innerHTML=`<div class="error">${type} price is not set by the Owner.</div>`;return}const amount=litres*rate;nozzles.push({type,index:i,opening:o,closing:cl,litres,rate,amount});totalLitres[type]+=litres;totalAmount[type]+=amount}machines.push({machine:m,nozzles})}try{await addDoc(collection(db,'dailyShifts'),{pumpId:currentPump.id,pumpCode:currentPump.code||currentPump.id,pumpName:currentPump.name,company:currentPump.company,date,shiftType:$('shiftType').value,machines,totalLitres,totalAmount,totalSale:totalAmount.petrol+totalAmount.diesel,createdBy:auth.currentUser.uid,createdByName:profile.name||auth.currentUser.email,createdAt:serverTimestamp()});$('dailyMsg').innerHTML=`<div class="success">Saved successfully. Petrol ${totalLitres.petrol.toFixed(2)} L • Diesel ${totalLitres.diesel.toFixed(2)} L • Total ${money(totalAmount.petrol+totalAmount.diesel)}</div>`;toast('Full Day Hisaab saved');}catch(e){$('dailyMsg').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
async function sales(){let rows=[];try{const q=query(collection(db,'dailyShifts'),where('pumpId','==',currentPump.id),orderBy('date','desc'),limit(30));const s=await getDocs(q);rows=s.docs.map(d=>({id:d.id,...d.data()}));}catch(e){return `<div class="card"><h2>Sales</h2><div class="error">${esc(e.message)}</div><p class="muted">If Firestore asks for an index, open the Firebase link shown in the error once and create the index.</p></div>`}return `<div class="hero"><div><h1>Sales History</h1><div class="muted">Latest saved Full Day Hisaab</div></div></div><div class="card table-wrap"><table class="table"><thead><tr><th>Date</th><th>Shift</th><th>Petrol L</th><th>Diesel L</th><th>Total Sale</th><th>Entered By</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.shiftType)}</td><td>${Number(r.totalLitres?.petrol||0).toFixed(2)}</td><td>${Number(r.totalLitres?.diesel||0).toFixed(2)}</td><td>${money(r.totalSale)}</td><td>${esc(r.createdByName)}</td></tr>`).join(''):`<tr><td colspan="6" class="empty">No entries yet.</td></tr>`}</tbody></table></div>`}
async function pricesPage(){const s=await getDoc(doc(db,'fuelPrices',currentPump.id));const p=s.exists()?s.data():prices;prices={petrol:p.petrol??null,diesel:p.diesel??null};if(profile.role!=='owner')return `<div class="hero"><div><h1>Fuel Prices</h1><div class="muted">Owner-controlled rates</div></div></div><div class="grid g2"><div class="card price-card"><div><div class="muted">Petrol</div><div class="price">${prices.petrol!=null?money(prices.petrol):'Not set'}</div></div><span class="badge lock">🔒 Staff view only</span></div><div class="card price-card"><div><div class="muted">Diesel</div><div class="price">${prices.diesel!=null?money(prices.diesel):'Not set'}</div></div><span class="badge lock">🔒 Staff view only</span></div></div>`;return `<div class="hero"><div><h1>Fuel Prices</h1><div class="muted">Only the Owner can change these rates.</div></div></div><div class="card"><div class="grid g2"><div class="field"><label>Petrol ₹ / litre</label><input id="petrolPrice" type="number" step="0.01" value="${prices.petrol??''}"></div><div class="field"><label>Diesel ₹ / litre</label><input id="dieselPrice" type="number" step="0.01" value="${prices.diesel??''}"></div></div><button class="btn primary" id="savePrices">Save Prices</button><div id="priceMsg"></div></div><div class="card" style="margin-top:16px"><h3>🔒 Staff protection</h3><p class="muted">The Staff interface has no edit control, and Firestore rules must also deny Staff write access to this price document.</p></div>`}
async function bindPrices(){if(profile.role!=='owner')return;$('savePrices').onclick=async()=>{const petrol=num($('petrolPrice').value),diesel=num($('dieselPrice').value);if(petrol==null||diesel==null||petrol<0||diesel<0){$('priceMsg').innerHTML='<div class="error">Enter valid Petrol and Diesel prices.</div>';return}try{await setDoc(doc(db,'fuelPrices',currentPump.id),{petrol,diesel,updatedBy:auth.currentUser.uid,updatedByName:profile.name||auth.currentUser.email,updatedAt:serverTimestamp()},{merge:true});prices={petrol,diesel};$('priceMsg').innerHTML='<div class="success">Prices saved. Staff can only view them.</div>';toast('Fuel prices saved');}catch(e){$('priceMsg').innerHTML=`<div class="error">${esc(e.message)}</div>`}}}
function expenses(){return `<div class="hero"><div><h1>Expenses</h1><div class="muted">Expense module ready for the next data-entry upgrade.</div></div></div><div class="card"><p class="muted">We'll add expense entry, categories, approval and reports next without changing your pump structure.</p></div>`}
function reports(){return `<div class="hero"><div><h1>Reports</h1><div class="muted">Use Sales History for saved daily totals. Advanced monthly reports are the next upgrade.</div></div></div><div class="card"><p class="muted">Your saved Full Day Hisaab records are stored per pump and can be expanded into monthly reports.</p></div>`}
function staff(){if(profile.role!=='owner')return '<div class="card"><h2>Access denied</h2></div>';return `<div class="hero"><div><h1>Staff</h1><div class="muted">Staff profiles are managed in Firebase for now.</div></div></div><div class="card"><p class="muted">Owner: ${esc(profile.name||'Akshat')} • You can manage Authentication users and their Firestore profiles from Firebase.</p></div>`}
async function render(){const p=$('page');if(currentPage==='dashboard')p.innerHTML=dashboard();else if(currentPage==='daily'){p.innerHTML=daily();bindDaily()}else if(currentPage==='sales')p.innerHTML=await sales();else if(currentPage==='prices'){p.innerHTML=await pricesPage();await bindPrices()}else if(currentPage==='expenses')p.innerHTML=expenses();else if(currentPage==='reports')p.innerHTML=reports();else if(currentPage==='staff')p.innerHTML=staff()}
window.goDaily=()=>{currentPage='daily';document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page==='daily'));render()};
onAuthStateChanged(auth,async user=>{if(!user){$('loginView').classList.remove('hidden');$('app').classList.add('hidden');return}try{await loadProfile();$('loginView').classList.add('hidden');$('app').classList.remove('hidden')}catch(e){$('loginView').classList.remove('hidden');$('loginError').textContent=e.message;$('loginError').classList.remove('hidden');await signOut(auth)}});
</script></body></html>
