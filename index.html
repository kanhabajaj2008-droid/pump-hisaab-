<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><link rel="manifest" href="manifest.json"><title>Pump Hisaab</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#f5f7fb;color:#172033}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:245px;background:#fff;border-right:1px solid #e6eaf0;padding:18px;position:fixed;inset:0 auto 0 0;z-index:5}.brand{font-size:22px;font-weight:800;margin:4px 8px 24px}.brand span{color:#2563eb}.nav button{width:100%;border:0;background:transparent;text-align:left;padding:12px;border-radius:10px;margin:3px 0;color:#536174}.nav button.active,.nav button:hover{background:#eaf2ff;color:#2563eb;font-weight:700}.main{margin-left:245px;width:calc(100% - 245px);padding:24px;max-width:1600px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.top h1{margin:0;font-size:28px}.muted{color:#718096}.btn{border:1px solid #d9e0ea;background:#fff;padding:9px 14px;border-radius:9px}.primary{background:#2563eb;color:#fff;border-color:#2563eb}.danger{background:#fee2e2;color:#b91c1c;border-color:#fecaca}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.card{background:#fff;border:1px solid #e5e9f0;border-radius:14px;padding:18px;box-shadow:0 2px 10px #1f293708}.kpi{font-size:25px;font-weight:800;margin-top:6px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.panel{background:#fff;border:1px solid #e5e9f0;border-radius:14px;padding:18px;margin-bottom:16px}.panel h3{margin:0 0 14px}.formgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.field label{display:block;font-size:12px;font-weight:700;color:#64748b;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #d8dee8;border-radius:8px;background:#fff}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 8px;border-bottom:1px solid #edf0f4;text-align:left;white-space:nowrap}.table th{font-size:12px;color:#64748b;background:#fafbfc}.actions{display:flex;gap:7px;flex-wrap:wrap}.machine{border:1px solid #e1e6ee;border-radius:12px;padding:14px;margin-bottom:12px}.machine h4{margin:0 0 10px}.nozzle{display:grid;grid-template-columns:1fr 1fr;gap:10px}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef2ff;color:#334155;font-size:12px}.empty{padding:30px;text-align:center;color:#7b8798}.toast{position:fixed;right:20px;bottom:20px;background:#172033;color:white;padding:12px 16px;border-radius:10px;z-index:99}.mobilebar{display:none}.login{min-height:100vh;display:grid;place-items:center;background:#f5f7fb}.loginbox{width:min(420px,92vw);background:#fff;padding:30px;border-radius:18px;border:1px solid #e5e9f0}.loginbox input{width:100%;padding:12px;margin:7px 0 14px;border:1px solid #d8dee8;border-radius:9px}.error{color:#b91c1c;margin:8px 0}.success{color:#15803d}.small{font-size:12px}@media(max-width:900px){.side{display:none}.main{margin:0;width:100%;padding:16px 16px 82px}.cards{grid-template-columns:repeat(2,1fr)}.grid2,.grid3{grid-template-columns:1fr}.formgrid{grid-template-columns:repeat(2,1fr)}.summary{grid-template-columns:repeat(2,1fr)}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e9f0;z-index:10;overflow:auto}.mobilebar button{flex:1;border:0;background:#fff;padding:9px 4px;font-size:11px;color:#64748b}.mobilebar button.active{color:#2563eb;font-weight:700}}@media(max-width:520px){.cards,.formgrid{grid-template-columns:1fr}.nozzle{grid-template-columns:1fr}}
</style></head><body><div id="root"></div><script type="module" src="js/app.js"></script></body></html>
