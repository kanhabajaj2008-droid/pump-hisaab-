<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><link rel="manifest" href="manifest.json"><title>Pump Hisaab V3</title><style>
:root{--bg:#07111f;--p:#0d1a2b;--p2:#112238;--t:#eef6ff;--m:#8fa5bd;--l:#1d344c;--a:#35d0ba;--b:#4d8dff;--d:#ff6878}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#163658,#07111f 42%,#050b13);color:var(--t);font-family:Inter,system-ui,Segoe UI,Arial}button,input,select{font:inherit}button{cursor:pointer}.hide{display:none!important}.top{height:72px;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:0 22px;background:#07111fe8;border-bottom:1px solid var(--l);backdrop-filter:blur(14px)}.logo{font-weight:900;font-size:21px}.logo i{color:var(--a);font-style:normal}.muted{color:var(--m);font-size:13px}.topright{display:flex;gap:9px;align-items:center}.pill,.btn,input,select{border-radius:10px}.pill{padding:9px 12px;border:1px solid var(--l);background:#0a1727;color:var(--t);font-size:12px}.btn{padding:10px 14px;border:1px solid var(--l);background:#122842;color:#e8f3ff;font-weight:800}.primary{background:linear-gradient(135deg,var(--a),#29a8da);color:#031219;border:0}.layout{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 72px)}aside{padding:16px;border-right:1px solid var(--l);background:#071321cc;position:sticky;top:72px;height:calc(100vh - 72px)}nav{display:grid;gap:6px}nav button{padding:12px;border:1px solid transparent;background:transparent;color:#a9bad0;text-align:left;border-radius:11px;font-weight:800}nav button.active,nav button:hover{background:#12314b;color:white;border-color:#23506d}.main{padding:24px;max-width:1500px;width:100%;margin:auto}.hero{display:flex;justify-content:space-between;gap:15px;align-items:start;margin-bottom:18px}.hero h1{margin:0 0 4px;font-size:29px}.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:linear-gradient(145deg,#112238f2,#091727f2);border:1px solid var(--l);border-radius:18px;padding:17px;box-shadow:0 18px 45px #0004}.stat .lab{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--m)}.stat .val{font-size:25px;font-weight:900;margin-top:6px}.field{display:grid;gap:5px;margin:10px 0}.field label{font-size:10px;text-transform:uppercase;color:#9eb1c6;font-weight:900}.field input,.field select{width:100%;padding:11px;border:1px solid #29445f;background:#081626;color:white}.machine{margin-top:13px;border:1px solid #1e3a54;border-radius:15px;padding:13px;background:#08162588}.mh{display:flex;justify-content:space-between}.nozzle{margin-top:10px;border:1px solid #19354d;border-radius:12px;padding:11px;background:#091a2b}.read{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.res{padding:10px;border-radius:10px;background:#10253a}.res small{display:block;color:var(--m);font-size:10px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--l);font-size:12px;text-align:left;white-space:nowrap}.empty{text-align:center;padding:25px;color:var(--m)}.err{padding:10px;border-radius:10px;background:#3b1820;color:#ffb9c1;border:1px solid #6b2b38;font-size:12px}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(430px,100%);padding:30px;background:#0b1a2ce8;border:1px solid #284963;border-radius:23px;box-shadow:0 30px 80px #0008}.toast{position:fixed;right:18px;bottom:18px;background:#eafff9;color:#06221d;padding:12px 15px;border-radius:10px;font-weight:900}.mobile{display:none}
@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:none}.main{padding:15px 12px 80px}.g2,.g4{grid-template-columns:1fr}.top{padding:0 12px}.topright .pill{display:none}.read{grid-template-columns:1fr}.mobile{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;bottom:0;left:0;right:0;background:#071321;border-top:1px solid var(--l);z-index:20}.mobile button{background:transparent;border:0;color:#9fb1c6;padding:9px 3px;font-size:10px}.mobile button.active{color:var(--a)}}
</style></head><body>
<div id="login" class="login"><div class="loginbox"><div class="logo">⛽ <i>Pump</i> Hisaab</div><div class="muted">V3 · Premium Pump Management</div><h1>Welcome back</h1><div id="loginErr" class="err hide"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div><button id="loginBtn" class="btn primary" style="width:100%">Sign in</button></div></div>
<div id="app" class="hide"><header class="top"><div><div class="logo">⛽ <i>Pump</i> Hisaab</div><div id="station" class="muted"></div></div><div class="topright"><select id="pump" class="pill"></select><span id="user" class="pill"></span><button id="logout" class="btn">Logout</button></div></header><div class="layout"><aside><nav id="nav"><button data-p="dashboard" class="active">⌂ Dashboard</button><button data-p="daily">⛽ Daily Hisaab</button><button data-p="sales">▦ Sales</button><button data-p="stock">◈ Stock</button><button data-p="expenses">₹ Expenses</button><button data-p="reports">◒ Reports</button><button data-p="staff">♙ Staff</button><button data-p="settings">⚙ Settings</button></nav></aside><main id="main" class="main"></main></div><div class="mobile"><button data-p="dashboard">⌂<br>Home</button><button data-p="daily">⛽<br>Hisaab</button><button data-p="sales">▦<br>Sales</button><button data-p="reports">◒<br>Reports</button></div></div><div id="toast" class="toast hide"></div>
<script src="js/config.js"></script><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js';import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from'https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js';import{getFirestore,collection,doc,getDoc,getDocs,addDoc,setDoc,query,where,orderBy,limit,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js';
const cfg=window.FIREBASE_CONFIG;if(!cfg)throw Error('Firebase config missing');const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id),money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let me=null,pumps=[],p=null,pg='dashboard',prices={petrol:0,diesel:0};const today=()=>new Date().toISOString().slice(0,10);function toast(x){$('toast').textContent=x;$('toast').classList.remove('hide');setTimeout(()=>$('toast').classList.add('hide'),2400)}function owner(){return me?.role==='owner'}
async function boot(){let u=auth.currentUser,s=await getDoc(doc(db,'users',u.uid));if(!s.exists())throw Error('User profile not found');me={uid:u.uid,...s.data()};let ps=await getDocs(collection(db,'pumps'));pumps=ps.docs.map(x=>({id:x.id,...x.data()})).filter(x=>x.active!==false&&(owner()||me.pumpAccess?.includes(x.id)));if(!pumps.length)throw Error('No pump access assigned');p=pumps[0];$('user').textContent=(me.name||'User')+' · '+me.role;$('pump').innerHTML=pumps.map(x=>`<option value="${x.id}">${esc(x.company)} · ${esc(x.name)}</option>`).join('');$('pump').value=p.id;$('staff').classList.toggle('hide',!owner());$('settings').classList.toggle('hide',!owner());await price();render()}async function price(){try{let s=await getDoc(doc(db,'fuelPrices',p.id));prices=s.exists()?s.data():{petrol:0,diesel:0}}catch{prices={petrol:0,diesel:0}}}$('pump').onchange=async e=>{p=pumps.find(x=>x.id===e.target.value);await price();render()};$('logout').onclick=()=>signOut(auth);document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{pg=b.dataset.p;document.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('active',x.dataset.p===pg));render()});function render(){let f={dashboard,daily,sales,stock,expenses,reports,staff,settings};$('station').textContent=p.name+' · '+p.company;$('main').innerHTML=(f[pg]||dashboard)();if(pg==='daily')dailyBind();if(pg==='sales')salesLoad();if(pg==='stock')stockLoad();if(pg==='expenses')expenseLoad();if(pg==='reports')reportLoad();if(pg==='staff')staffLoad();if(pg==='settings')settingsBind()}
function dashboard(){return `<div class="hero"><div><h1>Dashboard</h1><div class="muted">${esc(p.name)} · live operations</div></div><button class="btn primary" onclick="window.goDaily()">+ New Full Day Hisaab</button></div><div class="grid g4"><div class="card stat"><div class="lab">Petrol</div><div class="val">${money(prices.petrol)}</div></div><div class="card stat"><div class="lab">Diesel</div><div class="val">${money(prices.diesel)}</div></div><div class="card stat"><div class="lab">Role</div><div class="val" style="font-size:19px">${esc(me.role)}</div></div><div class="card stat"><div class="lab">Station</div><div class="val" style="font-size:16px">${esc(p.company)}</div></div></div><div class="grid g2" style="margin-top:14px"><div class="card"><h2>Today's workflow</h2><p class="muted">Meters → litres → amount → sales → stock → expenses → reports.</p><button class="btn" onclick="window.goDaily()">Open Daily Hisaab</button></div><div class="card"><h2>Access</h2><p class="muted">Owner has full control. Staff can operate daily entries and view operational data.</p></div></div>`}
function daily(){return `<div class="hero"><div><h1>Full Day Hisaab</h1><div class="muted">6 machines · 2 petrol + 2 diesel readings per machine</div></div><div><input id="shiftDate" class="pill" type="date" value="${today()}"> <button id="saveShift" class="btn primary">Save Day Hisaab</button></div></div><div id="dailyForm"></div>`}function dailyBind(){let h='';for(let m=1;m<=6;m++){h+=`<div class="machine"><div class="mh"><h3>Machine ${m}</h3><span class="pill">4 nozzles</span></div>`;[['petrol','Petrol 1'],['petrol','Petrol 2'],['diesel','Diesel 1'],['diesel','Diesel 2']].forEach((x,i)=>{let id=m+'_'+i;h+=`<div class="nozzle"><div class="mh"><b>${x[1]}</b><span class="pill">${x[0].toUpperCase()}</span></div><div class="read"><div class="field"><label>Opening</label><input type="number" min="0" step=".01" data-id="${id}" data-k="o"></div><div class="field"><label>Closing</label><input type="number" min="0" step=".01" data-id="${id}" data-k="c"></div><div class="res"><small>Result</small><b data-r="${id}">Unused</b></div></div></div>`});h+='</div>'}$('dailyForm').innerHTML=h;$('dailyForm').querySelectorAll('input').forEach(i=>i.oninput=()=>calc());$('saveShift').onclick=saveShift;function calc(){document.querySelectorAll('[data-r]').forEach(r=>{let id=r.dataset.r,o=document.querySelector(`[data-id="${id}"][data-k="o"]`).value,c=document.querySelector(`[data-id="${id}"][data-k="c"]`).value;if(o===''&&c===''){r.textContent='Unused';return}if(o===''||c===''){r.textContent='Incomplete';return}let l=+c-+o;r.textContent=l<0?'Invalid':l.toFixed(2)+' L · '+money(l*(id.endsWith('_0')||id.endsWith('_1')?prices.petrol:prices.diesel))})}}async function saveShift(){let meters={},bad=false,total=0;document.querySelectorAll('[data-id]').forEach(i=>{let id=i.dataset.id;meters[id]??={};meters[id][i.dataset.k]=i.value===''?null:+i.value});for(let v of Object.values(meters)){if((v.o==null)!=(v.c==null)||v.o!=null&&v.c<v.o)bad=true;if(v.o!=null&&v.c!=null)total+=v.c-v.o}if(bad)return toast('Fix incomplete or invalid readings');try{await addDoc(collection(db,'dailyShifts'),{pumpId:p.id,date:$('shiftDate').value,meters,totalLitres:total,petrolPrice:prices.petrol,dieselPrice:prices.diesel,createdBy:me.uid,createdByName:me.name||'',createdAt:serverTimestamp()});toast('Day Hisaab saved');render()}catch(e){toast(e.message)}}
function sales(){return `<div class="hero"><div><h1>Sales</h1><div class="muted">Daily Hisaab records and fuel amounts.</div></div></div><div class="card"><div id="salesTable" class="empty">Loading…</div></div>`}async function salesLoad(){try{let s=await getDocs(query(collection(db,'dailyShifts'),where('pumpId','==',p.id),orderBy('date','desc'),limit(50)));$('salesTable').innerHTML=s.docs.length?`<div class="tablewrap"><table class="table"><tr><th>Date</th><th>Litres</th><th>Petrol ₹</th><th>Diesel ₹</th><th>User</th></tr>${s.docs.map(d=>{let x=d.data();return `<tr><td>${x.date}</td><td>${(+x.totalLitres||0).toFixed(2)}</td><td>${money(x.petrolPrice)}</td><td>${money(x.dieselPrice)}</td><td>${esc(x.createdByName)}</td></tr>`}).join('')}</table></div>`:'<div class="empty">No sales yet.</div>'}catch(e){$('salesTable').innerHTML=`<div class="err">${esc(e.message)}</div>`}}
function stock(){return `<div class="hero"><div><h1>Stock</h1><div class="muted">Record fuel receipts.</div></div></div><div class="grid g2"><div class="card"><h3>Add receipt</h3><div class="field"><label>Fuel</label><select id="sf"><option>petrol</option><option>diesel</option></select></div><div class="field"><label>Litres</label><input id="sl" type="number" min="0" step=".01"></div><div class="field"><label>Note</label><input id="sn"></div><button id="ss" class="btn primary">Save Receipt</button></div><div class="card"><h3>Recent receipts</h3><div id="st" class="empty">Loading…</div></div></div>`}async function stockLoad(){$('ss').onclick=async()=>{let l=+$('sl').value;if(l<=0)return toast('Enter litres');await addDoc(collection(db,'stockEntries'),{pumpId:p.id,fuel:$('sf').value,litres:l,note:$('sn').value||'',createdBy:me.uid,createdAt:serverTimestamp()});toast('Receipt saved');stockLoad()};try{let s=await getDocs(query(collection(db,'stockEntries'),where('pumpId','==',p.id),limit(30)));$('st').innerHTML=s.docs.length?s.docs.map(d=>{let x=d.data();return `<div style="padding:8px;border-bottom:1px solid var(--l)">${esc(x.fuel)} · ${x.litres} L · ${esc(x.note)}</div>`}).join(''):'<div class="empty">No receipts.</div>'}catch(e){$('st').innerHTML=`<div class="err">${esc(e.message)}</div>`}}
function expenses(){return `<div class="hero"><div><h1>Expenses</h1><div class="muted">Track station expenses.</div></div></div><div class="grid g2"><div class="card"><h3>Add expense</h3><div class="field"><label>Category</label><select id="ec"><option>Salary</option><option>Electricity</option><option>Maintenance</option><option>Transport</option><option>Other</option></select></div><div class="field"><label>Amount</label><input id="ea" type="number" min="0" step=".01"></div><div class="field"><label>Note</label><input id="en"></div><button id="es" class="btn primary">Save Expense</button></div><div class="card"><h3>Recent</h3><div id="et" class="empty">Loading…</div></div></div>`}async function expenseLoad(){$('es').onclick=async()=>{let a=+$('ea').value;if(a<=0)return toast('Enter amount');await addDoc(collection(db,'expenses'),{pumpId:p.id,category:$('ec').value,amount:a,note:$('en').value||'',createdBy:me.uid,createdAt:serverTimestamp()});toast('Expense saved');expenseLoad()};try{let s=await getDocs(query(collection(db,'expenses'),where('pumpId','==',p.id),limit(50)));$('et').innerHTML=s.docs.length?s.docs.map(d=>{let x=d.data();return `<div style="padding:8px;border-bottom:1px solid var(--l)">${esc(x.category)} · ${money(x.amount)} · ${esc(x.note)}</div>`}).join(''):'<div class="empty">No expenses.</div>'}catch(e){$('et').innerHTML=`<div class="err">${esc(e.message)}</div>`}}
function reports(){return `<div class="hero"><div><h1>Reports</h1><div class="muted">Station operating summary.</div></div></div><div id="rep" class="grid g4"><div class="card stat"><div class="val">…</div></div></div>`}async function reportLoad(){try{let a=await getDocs(query(collection(db,'dailyShifts'),where('pumpId','==',p.id),limit(100))),b=await getDocs(query(collection(db,'expenses'),where('pumpId','==',p.id),limit(100)));let l=0,e=0;a.forEach(x=>l+=+x.data().totalLitres||0);b.forEach(x=>e+=+x.data().amount||0);$('rep').innerHTML=`<div class="card stat"><div class="lab">Shift entries</div><div class="val">${a.size}</div></div><div class="card stat"><div class="lab">Fuel litres</div><div class="val">${l.toFixed(2)}</div></div><div class="card stat"><div class="lab">Expenses</div><div class="val">${money(e)}</div></div><div class="card stat"><div class="lab">Prices</div><div class="val" style="font-size:16px">${money(prices.petrol)} / ${money(prices.diesel)}</div></div>`}catch(e){$('rep').innerHTML=`<div class="err">${esc(e.message)}</div>`}}
function staff(){return `<div class="hero"><div><h1>Staff</h1><div class="muted">Owner-only team list.</div></div></div><div class="card"><div id="team" class="empty">Loading…</div></div>`}async function staffLoad(){if(!owner())return;try{let s=await getDocs(collection(db,'users'));$('team').innerHTML=`<div class="tablewrap"><table class="table"><tr><th>Name</th><th>Email</th><th>Role</th><th>Active</th></tr>${s.docs.map(d=>{let x=d.data();return `<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${esc(x.role)}</td><td>${x.active?'Yes':'No'}</td></tr>`}).join('')}</table></div>`}catch(e){$('team').innerHTML=`<div class="err">${esc(e.message)}</div>`}}
function settings(){return `<div class="hero"><div><h1>Settings</h1><div class="muted">Owner controls.</div></div></div><div class="grid g2"><div class="card"><h3>Fuel prices</h3><div class="field"><label>Petrol ₹/L</label><input id="pp" type="number" step=".01" value="${prices.petrol||''}"></div><div class="field"><label>Diesel ₹/L</label><input id="dp" type="number" step=".01" value="${prices.diesel||''}"></div><button id="sp" class="btn primary">Save Prices</button></div><div class="card"><h3>Owner access</h3><p class="muted">Only owners can change fuel prices and manage staff. Staff cannot change these settings.</p></div></div>`}function settingsBind(){$('sp').onclick=async()=>{prices={petrol:+$('pp').value||0,diesel:+$('dp').value||0,updatedBy:me.uid,updatedAt:serverTimestamp()};await setDoc(doc(db,'fuelPrices',p.id),prices);toast('Prices updated');render()}}
window.goDaily=()=>{pg='daily';document.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('active',x.dataset.p==='daily'));render()};$('loginBtn').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);$('loginErr').classList.add('hide')}catch(e){$('loginErr').textContent=e.message;$('loginErr').classList.remove('hide')}};onAuthStateChanged(auth,async u=>{if(!u){$('login').classList.remove('hide');$('app').classList.add('hide');return}try{$('login').classList.add('hide');$('app').classList.remove('hide');await boot()}catch(e){$('login').removeClass?.('hide');$('loginErr').textContent=e.message;$('loginErr').classList.remove('hide')}});
</script></body></html>
