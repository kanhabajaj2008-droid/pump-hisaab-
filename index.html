<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><link rel="manifest" href="manifest.json"><title>Pump Hisaab</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f8fb;color:#172033;font:14px Arial,sans-serif}.hide{display:none!important}button,input,select{font:inherit}.btn{padding:10px 14px;border:0;border-radius:10px;font-weight:700;cursor:pointer}.blue{background:#2563eb;color:white}.gray{background:#e9eef5;color:#172033}.danger{background:#fee2e2;color:#991b1b}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox,.card{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:20px;box-shadow:0 5px 20px #1720330b}.loginbox{width:min(420px,100%)}.brand{font-size:28px;font-weight:900}.brand b{color:#2563eb}.input,select{width:100%;padding:10px;border:1px solid #dbe2ea;border-radius:9px;background:white}label{font-weight:700;display:block;margin:10px 0 5px}.app{display:flex;min-height:100vh}.side{width:235px;background:white;border-right:1px solid #e2e8f0;padding:20px;position:fixed;inset:0 auto 0 0}.nav{display:grid;gap:6px;margin-top:25px}.nav button{text-align:left;border:0;background:white;padding:12px;border-radius:9px;font-weight:700;color:#475569;cursor:pointer}.nav button.active,.nav button:hover{background:#eff6ff;color:#2563eb}main{margin-left:235px;width:calc(100% - 235px);padding:22px;max-width:1500px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:18px}.top h1{margin:0}.actions{display:flex;gap:8px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{font-size:24px;font-weight:900;margin-top:5px}.muted{color:#64748b}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.machine{padding:15px;border:1px solid #e2e8f0;border-radius:13px;background:white;margin:12px 0}.nozzles{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.sub{font-size:12px;color:#64748b}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;background:white;min-width:800px}.table th,.table td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left}.modal{position:fixed;inset:0;background:#0005;display:grid;place-items:center;padding:15px}.modalbox{background:white;border-radius:16px;padding:20px;max-width:900px;width:100%;max-height:92vh;overflow:auto}.mobile{display:none}@media(max-width:900px){.side{display:none}main{margin:0;width:100%;padding:15px 15px 75px}.cards{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}.nozzles{grid-template-columns:1fr 1fr}.mobile{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;z-index:5}.mobile button{border:0;background:white;padding:8px;font-size:11px}}
</style></head><body>
<div id="login" class="login"><div class="loginbox"><div class="brand">Pump <b>Hisaab</b></div><p class="muted">Daily pump accounting — readings, receiving, expenses and sillak.</p><label>Email</label><input id="email" class="input"><label>Password</label><input id="pass" type="password" class="input"><button id="loginBtn" class="btn blue" style="width:100%;margin-top:15px">Sign In</button><p id="msg" class="muted"></p></div></div>
<div id="app" class="app hide"><aside class="side"><div class="brand">Pump <b>Hisaab</b></div><p id="who" class="muted"></p><div class="nav"><button data-p="dash">⌂ Dashboard</button><button data-p="new">＋ New Day Hisaab</button><button data-p="history">▤ Day History</button><button data-p="reports">▥ Reports</button><button data-p="settings">⚙ Settings</button><button id="logout">↪ Logout</button></div></aside><main><div class="top"><div><h1 id="title">Dashboard</h1><span id="sub" class="muted"></span></div><div class="actions"><select id="pump" style="width:auto"><option value="AKSHAT">AKSHAT FILLING STATION</option><option value="PRAGATI">PRAGATI FILLING STATION</option></select><button id="quick" class="btn blue">＋ Day Hisaab</button></div></div><div id="content"></div></main></div><div class="mobile"><button data-p="dash">⌂<br>Home</button><button data-p="new">＋<br>New</button><button data-p="history">▤<br>History</button><button data-p="reports">▥<br>Reports</button></div><div id="modal" class="modal hide"></div>
<script src="js/config.js"></script><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';import{getFirestore,collection,addDoc,getDocs,getDoc,setDoc,doc,query,where,orderBy,limit,serverTimestamp}from'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';
const fb=initializeApp(FIREBASE_CONFIG),auth=getAuth(fb),db=getFirestore(fb);let me,pump='AKSHAT',page='dash';const $=x=>document.getElementById(x),today=()=>new Date().toISOString().slice(0,10),money=x=>'₹'+Number(x||0).toLocaleString('en-IN',{maximumFractionDigits:2}),pname=x=>x==='AKSHAT'?'AKSHAT FILLING STATION':'PRAGATI FILLING STATION';const totalExp=d=>(d?.expenses||[]).reduce((a,x)=>a+Number(x.amount||0),0),totalRec=d=>Object.values(d?.receiving||{}).reduce((a,x)=>a+Number(x||0),0),sales=d=>Number(d?.totals?.sales||0);
$('loginBtn').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('pass').value)}catch(e){$('msg').textContent=e.message}};$('logout').onclick=()=>signOut(auth);$('pump').onchange=()=>{pump=$('pump').value;render()};$('quick').onclick=()=>go('new');document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>go(b.dataset.p));
onAuthStateChanged(auth,async u=>{if(!u){$('login').classList.remove('hide');$('app').classList.add('hide');return}let s=await getDoc(doc(db,'users',u.uid));if(!s.exists()||s.data().active!==true){$('msg').textContent='Account inactive';return signOut(auth)}me={uid:u.uid,...s.data()};pump=(me.pumpAccess||['AKSHAT'])[0];$('pump').value=pump;$('who').textContent=(me.name||u.email)+' • '+me.role;$('login').classList.add('hide');$('app').classList.remove('hide');render()});
function go(x){page=x;document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('active',b.dataset.p===x));render()}async function days(){let q=query(collection(db,'dailyHisaab'),where('pumpId','==',pump),orderBy('date','desc'),limit(365));return(await getDocs(q)).docs.map(d=>({id:d.id,...d.data()}))}async function render(){$('title').textContent={dash:'Dashboard',new:'New Day Hisaab',history:'Day History',reports:'Reports',settings:'Settings'}[page];$('sub').textContent=pname(pump);if(page==='new')return newDay();if(page==='history')return history();if(page==='reports')return reports();if(page==='settings')return settings();return dashboard()}
async function dashboard(){let a=await days(),d=a.find(x=>x.date===today());$('content').innerHTML=`<div class="cards"><div class="card">Today's Sales<div class="metric">${money(sales(d))}</div></div><div class="card">Petrol<div class="metric">${(d?.totals?.petrolL||0).toFixed(2)} L</div></div><div class="card">Diesel<div class="metric">${(d?.totals?.dieselL||0).toFixed(2)} L</div></div><div class="card">Expenses<div class="metric">${money(totalExp(d))}</div></div></div><div class="grid2" style="margin-top:12px"><div class="card"><h2>Today's Hisaab</h2>${d?`<p>Receiving: <b>${money(totalRec(d))}</b></p><p>Sillak: <b>${money(d.sillak)}</b></p><button class="btn blue" onclick="openDay('${d.id}')">Open Complete Hisaab</button>`:`<p class="muted">No entry today.</p><button class="btn blue" onclick="go('new')">Create Today's Hisaab</button>`}</div><div class="card"><h2>Recent Days</h2>${a.slice(0,8).map(x=>`<p style="display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:8px"><span>${x.date}</span><b>${money(sales(x))}</b></p>`).join('')||'No records.'}</div></div>`}
function machine(i){return `<div class="machine"><h3>Machine ${i}</h3><div class="nozzles">${['Petrol 1','Petrol 2','Diesel 1','Diesel 2'].map((n,j)=>`<div><div class="sub">${n}</div><input class="input rd" data-m="${i}" data-n="${j}" data-t="${j<2?'petrol':'diesel'}" data-s="o" type="number" step=".01" placeholder="Opening"><input class="input rd" data-m="${i}" data-n="${j}" data-t="${j<2?'petrol':'diesel'}" data-s="c" type="number" step=".01" placeholder="Closing"></div>`).join('')}</div></div>`}
async function newDay(){let pr=await getDoc(doc(db,'fuelPrices',pump)),v=pr.exists()?pr.data():{};$('content').innerHTML=`<div class="card"><div class="row"><div><label>Date</label><input id="date" type="date" class="input" value="${today()}"></div><div><label>Petrol Price</label><input id="pp" type="number" step=".01" class="input" value="${v.petrol||0}"></div><div><label>Diesel Price</label><input id="dp" type="number" step=".01" class="input" value="${v.diesel||0}"></div><div><label>Pump</label><input class="input" value="${pname(pump)}" disabled></div></div></div><h2>Machine Readings</h2>${machine(1)}${machine(2)}<div class="card"><h2>Receiving / Collection</h2><div class="row">${['cash','online','credit','otp','pumpChange','firOther'].map(x=>`<div><label>${x==='pumpChange'?'Pump Change':x==='firOther'?'FIR / Other':x.toUpperCase()}</label><input id="r_${x}" class="input" type="number" value="0" step=".01"></div>`).join('')}</div></div><div class="card" style="margin-top:12px"><h2>Expenses</h2><div id="ex"></div><button class="btn gray" onclick="addEx()">＋ Add Expense</button></div><div class="card" style="margin-top:12px"><h2>Sillak / Closing</h2><div class="row"><div><label>Sillak Total (jo sillak ghar di)</label><input id="sillak" class="input" type="number" value="0" step=".01"></div><div><label>Notes</label><input id="notes" class="input"></div></div></div><div id="calc" class="card" style="margin-top:12px"></div><div style="text-align:right;margin-top:12px"><button id="save" class="btn blue">Save Complete Day Hisaab</button></div>`;addEx();document.querySelectorAll('.rd').forEach(x=>x.oninput=calc);$('pp').oninput=calc;$('dp').oninput=calc;$('save').onclick=save;calc()}
window.addEx=()=>{let d=document.createElement('div');d.className='row';d.style.marginBottom='8px';d.innerHTML=`<select class="input ec"><option>Electricity</option><option>Salary</option><option>Repair</option><option>Maintenance</option><option>Transport</option><option>Office</option><option>Cleaning</option><option>Miscellaneous</option></select><input class="input ea" type="number" placeholder="Amount"><input class="input ep" placeholder="Paid to"><input class="input ed" placeholder="Description">`;$('ex').appendChild(d)};
function readings(){let p=0,d=0,items=[],ok=true;document.querySelectorAll('.rd[data-s="o"]').forEach(o=>{let c=document.querySelector(`.rd[data-s="c"][data-m="${o.dataset.m}"][data-n="${o.dataset.n}"]`);if(o.value===''&&c.value==='')return;if(o.value===''||c.value===''){ok=false;return}let l=+c.value-+o.value;if(l<0){ok=false;return}items.push({machine:+o.dataset.m,nozzle:+o.dataset.n,type:o.dataset.t,opening:+o.value,closing:+c.value,litres:l});if(o.dataset.t==='petrol')p+=l;else d+=l});return{p,d,items,ok}}
function calc(){let r=readings(),a=r.p*+$('pp')?.value||0,b=r.d*+$('dp')?.value||0;$('calc').innerHTML=`<b>Live Calculation</b><div class="row" style="margin-top:10px"><div>Petrol<br><b>${r.p.toFixed(2)} L · ${money(a)}</b></div><div>Diesel<br><b>${r.d.toFixed(2)} L · ${money(b)}</b></div><div>Total<br><b>${(r.p+r.d).toFixed(2)} L · ${money(a+b)}</b></div><div style="color:${r.ok?'#16a34a':'#dc2626'}"><b>${r.ok?'✓ Valid':'⚠ Check readings'}</b></div></div>`}
async function save(){let r=readings();if(!r.ok)return alert('Complete every used nozzle and ensure closing is not below opening.');let pp=+$('pp').value||0,dp=+$('dp').value||0,ex=[...document.querySelectorAll('#ex .row')].map(x=>({category:x.querySelector('.ec').value,amount:+x.querySelector('.ea').value||0,paidTo:x.querySelector('.ep').value,description:x.querySelector('.ed').value})).filter(x=>x.amount||x.paidTo||x.description);let receiving={cash:+$('r_cash').value||0,online:+$('r_online').value||0,credit:+$('r_credit').value||0,otp:+$('r_otp').value||0,pumpChange:+$('r_pumpChange').value||0,firOther:+$('r_firOther').value||0};let data={date:$('date').value,pumpId:pump,pumpName:pname(pump),prices:{petrol:pp,diesel:dp},readings:r.items,totals:{petrolL:r.p,dieselL:r.d,litres:r.p+r.d,petrolAmount:r.p*pp,dieselAmount:r.d*dp,sales:r.p*pp+r.d*dp},receiving,expenses:ex,sillak:+$('sillak').value||0,notes:$('notes').value||'',createdBy:me.uid,createdByName:me.name||me.email,createdAt:serverTimestamp(),updatedAt:serverTimestamp()};try{await addDoc(collection(db,'dailyHisaab'),data);await addDoc(collection(db,'auditLogs'),{userId:me.uid,action:'created',module:'dailyHisaab',pumpId:pump,date:data.date,createdAt:serverTimestamp()});alert('Day Hisaab saved successfully.');go('dash')}catch(e){alert(e.message)}}
async function history(){let a=await days();$('content').innerHTML=`<div class="card"><div class="row"><div><label>From</label><input id="from" type="date" class="input"></div><div><label>To</label><input id="to" type="date" class="input"></div><div style="align-self:end"><button id="filter" class="btn blue">Filter</button></div></div></div><div class="tablewrap" style="margin-top:12px"><table class="table"><thead><tr><th>Date</th><th>Sales</th><th>Petrol</th><th>Diesel</th><th>Receiving</th><th>Expenses</th><th>Sillak</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>`;let fill=()=>{let x=a,f=$('from').value,t=$('to').value;if(f)x=x.filter(d=>d.date>=f);if(t)x=x.filter(d=>d.date<=t);$('tb').innerHTML=x.map(d=>`<tr><td>${d.date}</td><td>${money(sales(d))}</td><td>${(d.totals?.petrolL||0).toFixed(2)} L</td><td>${(d.totals?.dieselL||0).toFixed(2)} L</td><td>${money(totalRec(d))}</td><td>${money(totalExp(d))}</td><td>${money(d.sillak)}</td><td><button class="btn gray" onclick="openDay('${d.id}')">Open</button></td></tr>`).join('')||'<tr><td colspan="8">No entries</td></tr>'};fill();$('filter').onclick=fill}
window.openDay=async id=>{let s=await getDoc(doc(db,'dailyHisaab',id));if(!s.exists())return;let d={id,...s.data()};$('modal').classList.remove('hide');$('modal').innerHTML=`<div class="modalbox"><button class="btn gray" style="float:right" onclick="$('modal').classList.add('hide')">Close</button><h2>${d.date}</h2><p class="muted">${d.pumpName}</p><div class="cards"><div class="card">Sales<div class="metric">${money(sales(d))}</div></div><div class="card">Petrol<div class="metric">${(d.totals?.petrolL||0).toFixed(2)} L</div></div><div class="card">Diesel<div class="metric">${(d.totals?.dieselL||0).toFixed(2)} L</div></div><div class="card">Expenses<div class="metric">${money(totalExp(d))}</div></div></div><div class="grid2" style="margin-top:12px"><div class="card"><h3>Readings</h3>${(d.readings||[]).map(x=>`<p>M${x.machine} · ${x.type} ${x.nozzle+1}: ${x.opening} → ${x.closing} = <b>${x.litres.toFixed(2)} L</b></p>`).join('')||'No sales'}</div><div class="card"><h3>Receiving</h3>${Object.entries(d.receiving||{}).map(([k,v])=>`<p>${k}: <b>${money(v)}</b></p>`).join('')}<hr><p>Sillak: <b>${money(d.sillak)}</b></p></div></div><div class="card" style="margin-top:12px"><h3>Expenses</h3>${(d.expenses||[]).map(x=>`<p>${x.category} — ${money(x.amount)} ${x.paidTo?'· '+x.paidTo:''}</p>`).join('')||'No expenses'}</div><p><b>Notes:</b> ${d.notes||'—'}</p></div>`};
async function reports(){let a=await days(),s=a.reduce((x,d)=>x+sales(d),0),e=a.reduce((x,d)=>x+totalExp(d),0),p=a.reduce((x,d)=>x+(d.totals?.petrolL||0),0),di=a.reduce((x,d)=>x+(d.totals?.dieselL||0),0),sil=a.reduce((x,d)=>x+Number(d.sillak||0),0);$('content').innerHTML=`<div class="cards"><div class="card">Total Sales<div class="metric">${money(s)}</div></div><div class="card">Petrol<div class="metric">${p.toFixed(2)} L</div></div><div class="card">Diesel<div class="metric">${di.toFixed(2)} L</div></div><div class="card">Expenses<div class="metric">${money(e)}</div></div></div><div class="grid2" style="margin-top:12px"><div class="card"><h2>Net Summary</h2><p>Sales: <b>${money(s)}</b></p><p>Expenses: <b>${money(e)}</b></p><p>Net: <b>${money(s-e)}</b></p></div><div class="card"><h2>Sillak Report</h2><div class="metric">${money(sil)}</div><p class="muted">Total sillak entered for the displayed days.</p></div></div><div class="tablewrap" style="margin-top:12px"><table class="table"><tr><th>Date</th><th>Sales</th><th>Expenses</th><th>Receiving</th><th>Sillak</th></tr>${a.map(d=>`<tr><td>${d.date}</td><td>${money(sales(d))}</td><td>${money(totalExp(d))}</td><td>${money(totalRec(d))}</td><td>${money(d.sillak)}</td></tr>`).join('')}</table></div>`}
async function settings(){if(me.role!=='owner')return $('content').innerHTML='<div class="card"><b>Owner only.</b></div>';let s=await getDoc(doc(db,'fuelPrices',pump)),v=s.exists()?s.data():{};$('content').innerHTML=`<div class="card"><h2>Fuel Prices</h2><div class="row"><div><label>Petrol</label><input id="sp" class="input" type="number" step=".01" value="${v.petrol||0}"></div><div><label>Diesel</label><input id="sd" class="input" type="number" step=".01" value="${v.diesel||0}"></div></div><button id="savep" class="btn blue" style="margin-top:12px">Save Prices</button></div>`;$('savep').onclick=async()=>{let petrol=+$('sp').value||0,diesel=+$('sd').value||0;await setDoc(doc(db,'fuelPrices',pump),{petrol,diesel,updatedBy:me.uid,updatedAt:serverTimestamp()},{merge:true});await addDoc(collection(db,'fuelPriceHistory'),{pumpId:pump,petrol,diesel,changedBy:me.uid,changedAt:serverTimestamp()});alert('Prices saved')};}
window.go=go;
</script></body></html>
